name: Test MediaCat Manager

on:
  pull_request:
  push:
    branches:
      - beta
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install application dependencies
        run: python -m pip install -r 04_Implementation/haos/source/apps/mediacat_manager/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s 05_Tests -p "test_*.py"

  app-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required App package files
        shell: bash
        run: |
          set -euo pipefail
          test -f repository.yaml
          test -f 04_Implementation/haos/source/apps/mediacat_manager/config.yaml
          test -f 04_Implementation/haos/source/apps/mediacat_manager/Dockerfile
          test -x 04_Implementation/haos/source/apps/mediacat_manager/run.sh
          test ! -d 04_Source/mediacat_manager
          test ! -f config.yaml
